name: SI-X CI & Mesh Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run CI Pipeline Script
        run: |
          chmod +x scripts/ci_pipeline_workflow.sh
          ./scripts/ci_pipeline_workflow.sh

      - name: Run Mesh Deployment Script (CI Test Mode)
        env:
          CI_MODE: true
        run: |
          chmod +x scripts/deploy_mesh_workflow.sh
          ./scripts/deploy_mesh_workflow.sh
